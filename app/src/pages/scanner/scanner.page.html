<ion-content [fullscreen]="true" class="scanner-page">
  <div class="camera-overlay">
    <div class="scan-box"></div>
    <div class="scan-line"></div>
  </div>

  <div class="controls">
    <ion-button (click)="cancel()" color="light" fill="clear">
      <ion-icon slot="start" name="close"></ion-icon>
      Cancelar
    </ion-button>
  </div>
</ion-content>
