<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
    </ion-buttons>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding page-container">
  <div class="header-section">
    <h1 class="header-title">Bem-vindo de volta</h1>
    <p class="header-subtitle">Faça login para continuar economizando.</p>
  </div>

  <div class="form-card">
    <form [formGroup]="form" (ngSubmit)="login()">
      <ion-item lines="none" class="input-item">
        <ion-input
          label="E-mail"
          labelPlacement="stacked"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
        ></ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-input
          label="Senha"
          labelPlacement="stacked"
          type="password"
          formControlName="senha"
          placeholder="Sua senha"
        ></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" class="main-btn" [disabled]="carregando">
        @if (carregando) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Entrar
        }
      </ion-button>
    </form>
  </div>

  @if (mensagem) {
    <div class="success-message">{{ mensagem }}</div>
  }

  <div class="footer-link">
    <p>Não tem uma conta? <a (click)="router.navigate(['/cadastro'])">Criar conta</a></p>
  </div>
</ion-content>
