<ion-content class="page-container">
  <div class="auth-card">
    <div class="logo-container">
      <div class="logo-box">
        <ion-icon name="sparkles"></ion-icon>
      </div>
    </div>

    <div class="header-section">
      <h1 class="header-title">Bem-vindo de volta,</h1>
      <p class="header-subtitle">Insira seu e-mail e senha para continuar.</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="login()">
      <ion-item lines="none" class="input-item">
        <ion-input
          label="E-mail"
          labelPlacement="stacked"
          type="email"
          formControlName="email"
          placeholder="seu@email.com"
        ></ion-input>
      </ion-item>

      <ion-item lines="none" class="input-item">
        <ion-input
          label="Senha"
          labelPlacement="stacked"
          type="password"
          formControlName="senha"
          placeholder="Sua senha"
        ></ion-input>
      </ion-item>

      <ion-button expand="block" type="submit" class="main-btn" [disabled]="carregando">
        @if (carregando) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Entrar
        }
      </ion-button>
    </form>

    <div class="forgot-password">
      <a (click)="forgotPassword()">Esqueceu a senha?</a>
    </div>

    <div class="divider">ou</div>

    <ion-button expand="block" class="secondary-btn" (click)="router.navigate(['/cadastro'])">
      Criar uma Conta
    </ion-button>

    @if (mensagem) {
      <div class="success-message">
        {{ mensagem }}
      </div>
    }
  </div>
</ion-content>
